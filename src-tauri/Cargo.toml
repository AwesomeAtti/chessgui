[package]
name = "chessgui"
version = "0.1.0"
description = "A local-first desktop chess database and GUI"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"
publish = false

[lib]
# The lib/bin split is Tauri 2 convention: it is what makes a mobile target
# possible later without restructuring. Keep it even though desktop is the target.
name = "chessgui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
