[package]
name = "chessgui"
version = "0.1.0"
description = "A local-first desktop chess database and GUI"
edition = "2021"
# **Measured at B-007 milestone 2, and it corrects a claim rather than restating one (B-094).**
# The previous value here was 1.77.2, which has been untrue since session 5 added `pgn-reader`:
# that crate declares `rust-version = "1.88"` and the `shakmaty 0.30.1` it pulls in declares
# `1.95`. So the floor is set by the dependency graph, not by our source, and CI has pinned
# 1.95.0 all along. Read from the crates' own manifests; not verifiable by compiling here,
# because the AI sandbox can reach crates.io but not the toolchain archive.
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[lib]
# The lib/bin split is Tauri 2 convention: it is what makes a mobile target
# possible later without restructuring. Keep it even though desktop is the target.
name = "chessgui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# B-007 milestone 4 and B-117. Both are first-party Tauri plugins, both `Apache-2.0 OR MIT`
# — checked against the resolved metadata rather than assumed, per the standing licence
# constraint — and both are reached only through `src/shell/` on the frontend side (ADR-0001).
#
# `dialog` is the native file picker, which B-069 lists as an open platform surface: it is the
# reason file import got its own milestone rather than riding along with paste. It pulls in
# `tauri-plugin-fs` transitively; we grant no `fs:` permission, because the *reading* is done
# by our own command with paths the user chose, and a blanket filesystem permission would be a
# much larger surface than this feature needs.
#
# `opener` exists so an external URL opens in the user's browser. In a webview a bare anchor
# navigates the app window away from the app — see B-117, and do not "just add target=_blank".
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# ADR-0003: Rust owns bulk PGN parsing. ADR-0009: the libraries are the only validator.
#
# **`shakmaty` is deliberately not listed here**, though `pgn-reader` depends on it and re-exports it.
# The MVP importer never builds a board: hot fields come from tags, `plyCount` is a token count, and
# `result` comes from the tag or the termination marker. `pgn-reader` validates *syntax*; legality is
# a separate step that only happens if we ask shakmaty to play the moves — and asking is us adding
# validation, which ADR-0009 declines.
#
# Legality is still checked, in the place it is free: `mainline.ts` walks a game with `chessops` when
# the user opens it, and truncates at the first illegal move. One game rather than three thousand.
# shakmaty returns as a direct dependency when Rust genuinely needs positions — the position index
# (B-018/B-042) and engine analysis (B-019), both post-MVP — and the `variant` feature comes with it.
pgn-reader = "0.29"

# ADR-0005's `normalisedName` is specified as accent-stripped, and stripping accents correctly means
# Unicode decomposition rather than a hand-written table (AGENTS.md: industry standards first).
# MIT OR Apache-2.0, so GPL-3.0-or-later compatible — checked before adding, per the standing
# constraint. Its one dependency, `tinyvec`, is Zlib OR Apache-2.0 OR MIT.
#
# It is not a licence to guess: see `import::derive::normalise_name`, where decomposition alone was
# wrong for Cyrillic and a test caught it.
unicode-normalization = "0.1"

# B-011: local persistence. `bundled` compiles SQLite from source and statically links it, so
# there is no dependency on whatever SQLite version (or absence of one) ships on the user's
# system across Windows/macOS/Linux — the same portability reasoning that already governs this
# project's CI matrix (B-046). MIT, GPL-3.0-or-later compatible, checked before adding per the
# standing licence constraint.
rusqlite = { version = "0.40", features = ["bundled"] }

# An integration test in `tests/` can only use the crate's public API plus dev-dependencies, so
# serde_json is listed twice on purpose. Same version, already in the graph, so it costs no extra
# build — `tests/fixtures_contract.rs` needs it to read `fixtures/pgn/expected.json`.
[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
