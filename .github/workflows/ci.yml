# B-046 — three-OS build matrix.
#
# This workflow is what makes the amended cross-platform success criterion true rather
# than aspirational. Only macOS can currently be *tested* (B-068) because there are no
# Windows or Linux testers yet (B-070) — so the guarantee this file provides is narrower
# and worth stating plainly: **all three targets compile.** It cannot tell us how the app
# looks or feels anywhere except macOS.
#
# Set up now, while there is almost nothing to compile and a red build is trivial to
# diagnose. Retrofitting CI onto a year of accumulated platform drift is the expensive
# version of this task.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, guardrails, build)
    runs-on: ubuntu-latest
    steps:
      # v6 for both: v4 targets Node 20, which the runners now force onto Node 24 and
      # warn about. setup-node v6 limits automatic caching to npm, which is what the
      # explicit `cache: npm` below asks for anyway.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # B-072 / ADR-0001: no user-facing literals, no IPC calls outside src/shell/.
      - name: Check i18n and IPC boundary
        run: npm run check:i18n

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npx vite build

  build:
    name: Build (${{ matrix.platform }})
    needs: frontend
    strategy:
      # Do not cancel the other two when one fails: knowing whether a break is
      # platform-specific or universal is the entire point of the matrix.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      # v6 for both: v4 targets Node 20, which the runners now force onto Node 24 and
      # warn about. setup-node v6 limits automatic caching to npm, which is what the
      # explicit `cache: npm` below asks for anyway.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      # Pinned rather than `@stable`, so CI does not silently drift away from the
      # version the app is actually developed against (B-082). The developer machine
      # uses Homebrew Rust, which has no rustup and therefore ignores
      # rust-toolchain.toml — pinning here is the only half of that pin available.
      # Bump this deliberately, in step with the local toolchain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # tauri-build reads tauri.conf.json and expects frontendDist to exist.
      - name: Build frontend
        run: npx vite build

      # B-080. Both pass locally on 1.95.0 with zero output, so this is a guard against
      # regression rather than a cleanup task. Linux only: formatting and lints are
      # platform-independent, and running them three times just costs minutes.
      - name: Check formatting
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Tauri app
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --verbose
